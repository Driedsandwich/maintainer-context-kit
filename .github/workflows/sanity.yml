name: sanity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0

      - name: Verify candidate structure
        run: |
          test -f LICENSE
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f packet-spec/maintainer-task-packet-v0.1.md
          test -f templates/maintainer-task-packet.md

      - name: Run tests
        run: npm test

      - name: Run smoke checks
        run: |
          npm run doctor:json
          npm run handoff:demo
          npm run triage:demo
          npm run review:demo
