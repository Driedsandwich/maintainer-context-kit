name: Public-safe bug report
description: Report a reproducible product defect without private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private repository content, personal data, customer information, local paths, or raw packet output. Use private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect using public-safe or synthetic details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic input where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Public-safe environment summary
      placeholder: "Node 24.12.0, macOS arm64"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private repository text, personal data, customer information, local paths, and raw packet output.
          required: true
        - label: This is not a feature request or a vulnerability report.
          required: true
