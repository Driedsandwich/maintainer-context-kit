name: Documentation issue
description: Report unclear, incorrect, or missing public documentation.
title: "[Docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Documentation issues must be public-safe. Feature requests and outside contributions are not accepted during the preview.
  - type: input
    id: location
    attributes:
      label: Document or section
      placeholder: "README.md — Requirements"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, incorrect, or missing.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested clarification
      description: Optional public-safe wording or expected information.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private repository text, personal data, customer information, and local paths.
          required: true
        - label: This is not a feature request or a vulnerability report.
          required: true
